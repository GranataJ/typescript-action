name: Demo CICD Multi-Stage Deployment

on:
  workflow_run:
    workflows: ["Demo CI Pipeline"]
    types:
      - completed
permissions:
  actions: read
  id-token: write
  contents: read
jobs:
  deploy-dev:
    name: Dev Stage
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: 'dev'
      artifact-run-id: ${{ github.event.workflow_run.id }}
    secrets: inherit

  deploy-uat:
    name: UAT Stage
    needs: deploy-dev
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: 'uat'
      artifact-run-id: ${{ github.event.workflow_run.id }}
    secrets: inherit

  deploy-prod:
    name: Prod Stage
    needs: deploy-uat
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: 'prod'
      artifact-run-id: ${{ github.event.workflow_run.id }}
    secrets: inherit
